<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centr Supply Ops</title>
<meta name="theme-color" content="#0A0B0E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Centr Ops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --bg:#0A0B0E;--side:#0E1013;--panel:#13151A;--panel2:#191C22;--ink:#EDEFF3;--muted:#8A909B;--faint:#5B616C;--line:#22262E;--line2:#2C313A;
  --accent:#B9F23E;--accent2:#CBFA63;--accent-soft:rgba(185,242,62,.11);--on-accent:#0A0B0E;
  --ok:#4ADE80;--ok-soft:rgba(74,222,128,.12);--warn:#FBBF24;--warn-soft:rgba(251,191,36,.13);--bad:#F87171;--bad-soft:rgba(248,113,113,.13);--info:#60A5FA;--info-soft:rgba(96,165,250,.13);
  --shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.35);--r:14px;--glow:0 0 0 1px rgba(185,242,62,.35),0 0 24px rgba(185,242,62,.12);
}
:root[data-theme="light"]{color-scheme:light;
  --bg:#F4F5F7;--side:#FFFFFF;--panel:#FFFFFF;--panel2:#F7F8FA;--ink:#111318;--muted:#646A75;--faint:#9AA0AA;--line:#E5E7EB;--line2:#D9DCE1;
  --accent:#3F6212;--accent2:#4D7C0F;--accent-soft:#ECF7D4;--on-accent:#FFFFFF;
  --ok:#15803D;--ok-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--bad:#B91C1C;--bad-soft:#FEE2E2;--info:#1D4ED8;--info-soft:#DBEAFE;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);--glow:0 0 0 1px rgba(63,98,18,.35);
}
*{box-sizing:border-box}
input[type=checkbox]{accent-color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid var(--bg)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;border-right:1px solid var(--line);background:var(--side)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#3DDC97);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;box-shadow:0 0 22px rgba(185,242,62,.25)}
#nav{display:flex;flex-direction:column;gap:2px}
.nv{position:relative;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--muted);text-align:left;font-weight:550;transition:background .15s,color .15s}
.nv svg{width:18px;height:18px;flex:none}
.nv:hover{background:var(--panel2);color:var(--ink)}
.nv.on{background:var(--accent-soft);color:var(--ink)}
.nv.on svg{color:var(--accent)}
.side .nv.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nv .cnt{margin-left:auto;font-size:11px;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:99px;padding:0 7px;font-weight:700;font-family:"JetBrains Mono",monospace}
.sync{display:flex;gap:8px;align-items:center;padding:10px;border-radius:9px;font-size:12px;color:var(--muted);cursor:pointer;border:1px solid var(--line);background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn);animation:pulse 1s infinite}.dot.err{background:var(--bad)}.dot.local{background:var(--info)}
@keyframes pulse{50%{opacity:.35}}
main{min-width:0;padding:0 28px 60px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:18px 0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.search{position:relative;flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.qres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;max-height:360px;overflow:auto;z-index:20}
.qres.open{display:block}
.qres button{display:flex;width:100%;gap:10px;justify-content:space-between;padding:8px 12px;border:0;background:none;text-align:left;cursor:pointer}
.qres button:hover{background:var(--panel2)}
.qres small{color:var(--muted)}
.quick{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent2);box-shadow:var(--glow)}
.btn.primary{font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:550;text-align:left}
.banner{margin:0 0 16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--info-soft);color:var(--info);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);text-align:left}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(185,242,62,.35),transparent);opacity:.6}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--line2);box-shadow:var(--glow)}
.kpi .l{color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:clamp(20px,1.9vw,28px);white-space:nowrap;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;flex-wrap:wrap}
.card-h h2{font-size:15px;margin:0;font-weight:750;letter-spacing:-.01em}
.card-h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card-b{padding:6px 16px 16px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.cols>.card{margin-bottom:0}
.cols>*,.stack>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.ck{width:34px}
.muted{color:var(--muted)}.small{font-size:12.5px}.nowrap{white-space:nowrap}
.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:7px;font-size:12px;font-weight:650;white-space:nowrap;border:0;background:var(--panel2);color:var(--muted)}
button.pill{cursor:pointer}button.pill:hover{filter:brightness(.95)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}.pill.accent{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.toolbar input[type=search]{min-width:200px;flex:1;max-width:320px}
.toolbar .sp{margin-left:auto;display:flex;gap:8px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:550}
.foot-tot{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:0 4px}
.foot-tot b{color:var(--ink)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.ccard:hover{border-color:var(--faint)}
.ccard h3{margin:0 0 2px;font-size:15px}
.ccard .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
.ccard .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.ccard.off{opacity:.55}
.hbar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hbar .t{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.hbar .t i{display:block;height:100%;background:linear-gradient(90deg,#3DDC97,var(--accent))}
svg.bars{width:100%;height:auto;display:block}
svg.bars .bb{fill:var(--accent);opacity:.92}svg.bars rect:hover{opacity:1}svg.bars .bp{fill:var(--accent);opacity:.3}
svg.bars .bl{fill:var(--muted);font-size:11px}svg.bars .bv{fill:var(--ink);font-size:11px;font-weight:600}
.spark{color:var(--accent);display:block}
.big{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
details.help{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;color:var(--muted)}
details.help summary{cursor:pointer;color:var(--ink);font-weight:550}
details.help p{margin:8px 0 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,8,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.modal.open{display:flex}
.dlg{background:var(--panel);border-radius:16px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.dlg.wide{max-width:760px}
.dlg-h{display:flex;align-items:center;padding:16px 18px 8px}
.dlg-h h3{margin:0;font-size:17px}
.x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.dlg-b{padding:8px 18px 4px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 16px;flex-wrap:wrap}
.dlg-f .left{margin-right:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px}
.span2{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:550}
.fld input,.fld select,.fld textarea{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.toolbar input:focus,.search input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px;font-weight:550;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.lines-h{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.lines-h input{margin-left:auto;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);width:160px}
.lines{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;margin-bottom:14px}
.ln{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ups{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--faint);cursor:pointer;white-space:nowrap}
.ups.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.upsTag{display:inline-block;background:var(--warn-soft);color:var(--warn);padding:0 6px;font-size:11px;border-radius:6px;font-weight:600;margin-right:4px}
.mini-sel{padding:5px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;max-width:150px}
.mini-num{width:92px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);text-align:right}
.ln .x{font-size:18px;margin-left:2px}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vrow:last-child{border-bottom:0}
.gridtbl td,.gridtbl th{padding:7px 10px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.ln.has{background:var(--accent-soft)}
.ln .nm{flex:1;min-width:0;cursor:pointer}
.ln .nm b{font-weight:550}
.ln .nm small{display:block;color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.step button{width:32px;height:32px;border:0;background:none;cursor:pointer;font-size:17px;color:var(--muted)}
.step button:hover{background:var(--panel2);color:var(--ink)}
.step input{width:46px;text-align:center;border:0;background:none;padding:0;height:32px;font-weight:600}
.lines-tot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:-6px 2px 12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60;font-weight:550;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.bnav{display:none}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--faint);margin-left:4px}
.settings-sec{max-width:720px}
.settings-sec p{color:var(--muted);margin:4px 0 12px}
code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
.releve-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.tot-box{display:grid;grid-template-columns:auto auto;gap:4px 24px;justify-content:end;padding:12px 16px;font-variant-numeric:tabular-nums}
.tot-box .g{font-weight:700;font-size:16px}
.pick-done td{opacity:.4;text-decoration:line-through}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.stp .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);flex:none;font-size:14px}
.stp .tx{flex:1;min-width:0}.stp .tx b{display:block;font-weight:650}.stp .tx small{color:var(--muted)}
.stp .n{font-weight:800;color:var(--accent);min-width:18px}
.attn{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;white-space:pre-wrap;margin-top:8px}
.sop h3{margin:0 0 8px;font-size:15px}
.sop ol{margin:0;padding-left:20px}.sop li{padding:3px 0}
.stepEd{display:grid;grid-template-columns:165px 1fr 150px 170px 60px 30px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.stepEd select,.stepEd input{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);width:100%}
@media (max-width:860px){.stepEd{grid-template-columns:1fr 1fr}.stepEd .wide{grid-column:1/-1}}
@media print{body.print-fiche #view>*:not(.fiche-print){display:none!important}.fiche-print{break-inside:avoid}.stp{background:#fff}}
.pick-q{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.loglist .ln{font-size:13px}
body.portal .side,body.portal .quick,body.portal .search,body.portal .bnav,body.portal #banner{display:none!important}
body.portal .app{grid-template-columns:1fr}
body.portal main{max-width:1180px;margin:0 auto}
body.role-prep .search,body.role-prep [data-act="newOrder"]{display:none!important}
.role-badge{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:650;font-size:12.5px;border:0;cursor:pointer;text-align:left}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:0 16px 90px}
  .top{flex-wrap:wrap;gap:10px}
  .top h1{font-size:18px}
  .search{order:3;max-width:none;flex-basis:100%}
  .quick{margin-left:auto}
  .hide-sm{display:none}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;gap:2px}
  .bnav .nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-width:64px;align-items:center}
  .bnav .nv .cnt{display:none}
  .grid2{grid-template-columns:1fr}
  .hbar{grid-template-columns:110px 1fr 34px}
  .dlg-f .btn{flex:1;justify-content:center}
  .toast{bottom:84px}
}
@media (max-width:860px){.cols[style]{grid-template-columns:1fr!important}.ln{flex-wrap:wrap}.ln .nm{flex-basis:100%}.mini-sel{max-width:none;flex:1}}
/* ===== Mode scan ===== */
#scanui{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--ink);flex-direction:column}
#scanui.open{display:flex}
.sc-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--side)}
.sc-top b{font-size:15px}.sc-top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.sc-stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}.sc-stats b{color:var(--ink)}
.sc-cam{position:relative;background:#000;height:min(36vh,320px);overflow:hidden;flex:none}
.sc-cam video{width:100%;height:100%;object-fit:cover}
.sc-cam .reticle{position:absolute;top:50%;left:50%;height:76%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:3px solid rgba(185,242,62,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.sc-cam .camoff{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;text-align:center;padding:16px;font-size:14px}
.sc-flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
.sc-flash.ok{background:rgba(74,222,128,.45);opacity:1}.sc-flash.bad{background:rgba(248,113,113,.55);opacity:1}
.sc-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.sc-target{border:2px solid var(--accent);border-radius:18px;padding:16px 18px;background:var(--panel)}
.sc-target .bin{font-size:clamp(44px,13vw,84px);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent)}
.sc-target .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sc-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sc-item .q{font-size:34px;font-weight:800;min-width:64px;font-variant-numeric:tabular-nums}
.sc-item .nm{flex:1;min-width:0}.sc-item .nm b{display:block;font-size:17px}.sc-item .nm small{color:var(--muted)}
.sc-msg{min-height:22px;font-weight:700;text-align:center}
.sc-msg.ok{color:var(--ok)}.sc-msg.bad{color:var(--bad)}
.sc-next{display:flex;gap:6px;flex-wrap:wrap}
.sc-next .pill{font-size:13px;padding:5px 10px}
.sc-bar{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden}.sc-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sc-big{width:100%;justify-content:center;padding:16px;font-size:17px;border-radius:14px}
.sc-order{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel)}
.sc-order h2{margin:0;font-size:28px;letter-spacing:-.02em}
/* ===== Étiquettes ===== */
#printArea{display:none}
.lab{display:flex;align-items:center;gap:3mm;overflow:hidden;box-sizing:border-box;color:#000;background:#fff;font-family:"Plus Jakarta Sans",Arial,sans-serif}
.lab svg{flex:none}
.lab .t b{display:block;font-weight:800;line-height:1}
.lab .t small{display:block;color:#333;line-height:1.2;margin-top:1mm}
.labprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.labprev .lab{border:1px dashed var(--line2);border-radius:8px;padding:10px;height:110px}
@media print{
  body.print-labels>*:not(#printArea){display:none!important}
  body.print-labels #printArea{display:block!important}
}
@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#fafafa;--ink:#000;--muted:#555;--faint:#777;--line:#ddd;--accent:#3F6212}
  .side,.top,.bnav,#banner,.noprint,.toolbar{display:none!important}
  .app{display:block}main{padding:0}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border-color:#ddd}
  body.print-releve #view>*:not(.releve){display:none!important}
}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">CS</div><div><b>Centr Supply</b><small>Clients · commandes · stock</small></div></div>
    <nav id="nav"></nav>
    <div id="roleBox" style="margin-top:auto"></div>
    <button class="nv" data-act="theme" title="Basculer clair / sombre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="themeLbl">Thème clair</span></button>
    <div class="sync" id="sync" data-act="syncNow" title="Cliquer pour synchroniser" style="margin-top:4px"></div>
  </aside>
  <main>
    <header class="top">
      <h1 id="title"></h1>
      <div class="search"><input id="q" type="search" placeholder="Rechercher une commande, un produit, un client…  ( / )" autocomplete="off"><div id="qres" class="qres"></div></div>
      <div class="quick">
        <button class="btn ghost hide-sm" data-act="newReturn" title="Raccourci : R">↩ Retour</button>
        <button class="btn ghost hide-sm" data-act="newReception" title="Raccourci : E">⤓ Réception</button>
        <button class="btn primary" data-act="newOrder" title="Raccourci : N">+ Commande</button>
      </div>
    </header>
    <div id="banner"></div>
    <section id="view"></section>
  </main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="modal" class="modal"></div>
<div id="toast" class="toast"></div>
<div id="scanui"></div>
<div id="printArea"></div>

<script>
'use strict';
/* ============ utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const eur=n=>(Number(n)||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const num=n=>(Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:1});
const fd=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'—';
const fdl=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'—';
const monthLabel=m=>{if(!m)return'';const [y,mo]=m.split('-');const s=new Date(+y,+mo-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
const prevMonth=m=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const nowISO=()=>new Date().toISOString();
const round2=n=>Math.round((Number(n)||0)*100)/100;

/* ============ modèle de données (identique au script Google) ============ */
const SCHEMA={
  clients:['id','nom','type','contact','telephone','email','prix_prep','prix_upsell','prix_retour','emballage','consignes','portail','notes','actif','created','updated'],
  produits:['id','client_id','sku','nom','emplacement','prix','cout','seuil','delai','couverture','fefo','actif','created','updated'],
  commandes:['id','numero','date','client_id','destinataire','lignes','ups','statut','date_exp','transporteur','suivi','montant','paiement','montant_paye','date_paiement','notes','created','updated'],
  retours:['id','dossier','date','client_id','commande_id','produit_id','qte','motif','etat','decision','notes','created','updated'],
  mouvements:['id','date','produit_id','type','qte','lot','dlc','note','created','updated'],
  frais:['id','date','client_id','libelle','qte','pu','montant','paiement','montant_paye','date_paiement','auto','notes','created','updated'],
  parametres:['id','valeur','created','updated'],
  journal:['id','date','user','sheet','ref','action','created','updated']
};
const NUMF={clients:['prix_prep','prix_upsell','prix_retour'],produits:['prix','cout','seuil','delai','couverture'],commandes:['ups','montant','montant_paye'],retours:['qte'],mouvements:['qte'],frais:['qte','pu','montant','montant_paye']};
/* Prix par défaut (HT) — modifiables dans Réglages, et par client dans sa fiche */
const DEF_PRICES={prep:1.30,upsell:0.30,retour:2.00};
const CTYPES=['Marque e-com (logistique)','Client B2B','Marque propre'];
const ST={a_preparer:['À préparer','warn'],preparee:['Préparée','info'],expediee:['Expédiée','accent'],livree:['Livrée','ok'],annulee:['Annulée','']};
const ST_FLOW=['a_preparer','preparee','expediee','livree'];
const PAY={non:['Non payé','bad'],partiel:['Partiel','warn'],paye:['Payé','ok']};
const MOTIFS=['Défaut / casse','Erreur de préparation','Colis non réclamé',"Changement d'avis",'Taille / teinte','Autre'];
const ETATS={a_verifier:['À vérifier','warn'],revendable:['Revendable','ok'],abime:['Abîmé','bad']};
const DECI={attente:['En attente','warn'],stock:['Remis en stock','ok'],renvoye:['Renvoyé à la marque','info'],detruit:['Détruit','']};
const MVT={reception:'Réception',ajustement:'Inventaire',perte:'Perte / casse'};
const LVL={rupture:{l:'Rupture',t:'bad',o:0},now:{l:'À commander',t:'bad',o:1},soon:{l:'Bientôt',t:'warn',o:2},ok:{l:'OK',t:'ok',o:3},idle:{l:'Sans ventes',t:'',o:4}};
const CARRIERS=['Colissimo','Mondial Relay','Chronopost','DPD','UPS','GLS','Main propre','Livraison locale'];
const OWN='';const OWN_LABEL='Stock propre Centr Supply';const EMB='__emb';const EMB_LABEL='Consommables (emballages)';
const QS=new URLSearchParams(location.search);const PORTAL=QS.get('portail');let ROLE=LS.get('cs_role','admin');
const PREP_ROUTES=['picking','process','returns','stock','forecast','labels'];

/* ============ état ============ */
let CFG=LS.get('cs_cfg',{url:'',token:''});
let DB=emptyDB();
let Q=LS.get('cs_queue',[]);
let ROUTE=LS.get('cs_route','home'), PARAM=null;
const F={orders:{q:'',client:'',statut:'',pay:'',month:'',ups:''},stock:{q:'',owner:'all',lvl:''},returns:{client:'',month:'',dec:''},forecast:{owner:'all'},pick:{client:'',inc:'a_preparer'},releve:{month:todayStr().slice(0,7)}};
const SEL=new Set();
let SYNC={state:'local',msg:''};
function emptyDB(){const o={};Object.keys(SCHEMA).forEach(k=>o[k]=[]);return o}

function normRow(sheet,r){
  const o={};SCHEMA[sheet].forEach(k=>{const v=r[k];o[k]=v==null?'':v});
  (NUMF[sheet]||[]).forEach(k=>{if(o[k]!=='')o[k]=Number(String(o[k]).replace(',','.'))||0});
  if('actif' in o)o.actif=!(o.actif===false||o.actif===0||['false','non','0'].includes(String(o.actif).toLowerCase()));
  ['id','client_id','produit_id','commande_id','numero','sku','telephone','dossier'].forEach(k=>{if(k in o)o[k]=String(o[k])});
  ['date','date_paiement','date_exp'].forEach(k=>{if(k in o&&o[k])o[k]=String(o[k]).slice(0,10)});
  if(sheet==='commandes'){
    if(typeof o.lignes==='string'){try{o.lignes=o.lignes?JSON.parse(o.lignes):[]}catch(e){o.lignes=[]}}
    if(!Array.isArray(o.lignes))o.lignes=[];
    o.lignes=o.lignes.map(l=>({p:String(l.p),q:Number(l.q)||0})).filter(l=>l.q>0);
    o.statut=ST[o.statut]?o.statut:'a_preparer';o.ups=Number(o.ups)||0;
  }
  if(sheet==='commandes'||sheet==='frais'){o.paiement=PAY[o.paiement]?o.paiement:'non';o.montant=Number(o.montant)||0;o.montant_paye=Number(o.montant_paye)||0}
  if(sheet==='frais'){o.qte=o.qte===''?1:Number(o.qte)||0;o.pu=Number(o.pu)||0;o.auto=String(o.auto||'')}
  if(sheet==='retours'){o.qte=Number(o.qte)||0;o.decision=DECI[o.decision]?o.decision:'attente';o.etat=ETATS[o.etat]?o.etat:'a_verifier'}
  if(sheet==='mouvements'){o.qte=Number(o.qte)||0;o.lot=String(o.lot||'');o.dlc=o.dlc?String(o.dlc).slice(0,10):''}
  if(sheet==='clients'){let c=o.consignes;if(typeof c==='string'){try{c=c?JSON.parse(c):null}catch(e){c=null}}c=c&&typeof c==='object'?c:{};o.consignes={etapes:Array.isArray(c.etapes)?c.etapes.filter(x=>x&&x.txt):[],attention:String(c.attention||''),photo:String(c.photo||''),maj:String(c.maj||'')}}
  if(sheet==='produits')o.fefo=o.fefo===true||['true','1','oui'].includes(String(o.fefo).toLowerCase());
  return o;
}
function normDB(d){const o=emptyDB();Object.keys(SCHEMA).forEach(k=>o[k]=((d&&d[k])||[]).filter(r=>r&&r.id!==''&&r.id!=null).map(r=>normRow(k,r)));return o}
function serRow(sheet,r){const o={};SCHEMA[sheet].forEach(k=>{let v=r[k];if(k==='lignes'||k==='tarifs')v=JSON.stringify(v||[]);if(k==='consignes')v=v&&((v.etapes||[]).length||v.attention||v.photo)?JSON.stringify(v):'';if(v===undefined||v===null)v='';o[k]=v});return o}

/* ============ persistance & synchro Google Sheets ============ */
function persist(){LS.set('cs_db',DB);LS.set('cs_queue',Q);invalidate()}
async function api(body){
  const r=await fetch(CFG.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},body,{token:CFG.token}))});
  const t=await r.text();let j;
  try{j=JSON.parse(t)}catch(e){throw new Error('Réponse illisible du script (vérifie le déploiement et l’accès « Tout le monde »)')}
  if(!j.ok)throw new Error(j.error||'Erreur du script');
  return j;
}
function stamp(row){row.updated=nowISO();if(!row.created)row.created=row.updated}
function put(sheet,row){stamp(row);const a=DB[sheet];const i=a.findIndex(x=>x.id===row.id);if(i>=0)a[i]=row;else a.push(row);if(CFG.url)Q.push({action:'upsert',sheet,row:serRow(sheet,row)})}
function save(sheet,row){const o=DB[sheet].find(x=>x.id===row.id);const msg=describe(sheet,o?{...o}:null,row);put(sheet,row);logEntry(sheet,row.id,msg);persist();render();flush()}
function saveMany(items,label){const msgs=items.length<=20?items.map(([s,r])=>{const o=DB[s].find(x=>x.id===r.id);return[s,r.id,describe(s,o?{...o}:null,r)]}):null;
  items.forEach(([s,r])=>put(s,r));
  if(msgs)msgs.forEach(([s,id,m])=>logEntry(s,id,m));else if(items.length)logEntry(items[0][0],'',label||`${items.length} modifications (${[...new Set(items.map(i=>i[0]))].join(', ')})`);
  persist();render();flush()}
function removeRow(sheet,id){const o=DB[sheet].find(x=>x.id===id);if(o&&sheet!=='journal')logEntry(sheet,id,`Supprimé : ${o.numero||o.nom||o.libelle||pname(o.produit_id)||id}`);DB[sheet]=DB[sheet].filter(x=>x.id!==id);if(CFG.url)Q.push({action:'delete',sheet,id});persist();render();flush()}
let flushing=false;
async function flush(){
  if(!CFG.url||flushing)return;
  if(!Q.length){setSync('ok');return}
  flushing=true;setSync('busy');
  try{while(Q.length){const b=Q.slice(0,150);await api({action:'bulk',ops:b});Q.splice(0,b.length);LS.set('cs_queue',Q)}setSync('ok')}
  catch(e){setSync('err',e.message)}
  flushing=false;
}
async function pull(showToast){
  if(!CFG.url)return;
  if(Q.length)await flush();
  if(Q.length||flushing)return;
  setSync('busy');
  try{const j=await api({action:'all'});DB=normDB(j.data);persist();setSync('ok');render();if(showToast)toast('Données à jour')}
  catch(e){setSync('err',e.message)}
}
function setSync(state,msg){SYNC={state,msg:msg||''};renderSync();renderBanner()}
setInterval(()=>{if(Q.length)flush()},20000);
window.addEventListener('focus',()=>{if(CFG.url&&!Q.length&&!flushing&&!$('#modal').classList.contains('open'))pull()});

/* ============ calculs ============ */
let CACHE=null;
function invalidate(){CACHE=null}
function calc(){
  if(CACHE)return CACHE;
  const stock={},daily={},cmap={},pmap={};
  DB.clients.forEach(c=>cmap[c.id]=c);
  DB.produits.forEach(p=>{pmap[p.id]=p;stock[p.id]=0});
  DB.mouvements.forEach(m=>{stock[m.produit_id]=(stock[m.produit_id]||0)+(Number(m.qte)||0)});
  DB.retours.forEach(r=>{if(r.decision==='stock')stock[r.produit_id]=(stock[r.produit_id]||0)+(Number(r.qte)||0)});
  DB.commandes.forEach(o=>{if(o.statut==='annulee')return;o.lignes.forEach(l=>{stock[l.p]=(stock[l.p]||0)-l.q;const d=daily[l.p]||(daily[l.p]={});d[o.date]=(d[o.date]||0)+l.q})});
  DB.commandes.forEach(o=>{if(o.statut==='annulee')return;const c=cmap[o.client_id];if(!c)return;const u={};if(c.emballage&&pmap[c.emballage])u[c.emballage]=1;(c.consignes&&c.consignes.etapes||[]).forEach(st=>{if(st.conso&&pmap[st.conso]&&stepApplies(st,o))u[st.conso]=(u[st.conso]||0)+(Number(st.q)||1)});for(const e in u){stock[e]=(stock[e]||0)-u[e];const d=daily[e]||(daily[e]={});d[o.date]=(d[o.date]||0)+u[e]}});
  CACHE={stock,daily,cmap,pmap};return CACHE;
}
const client=id=>calc().cmap[id];
const prod=id=>calc().pmap[id];
const cname=id=>id===OWN?OWN_LABEL:id===EMB?EMB_LABEL:(client(id)?.nom||'—');
const pname=id=>prod(id)?.nom||'Produit supprimé';
const stockOf=id=>calc().stock[id]||0;
const qtyOf=o=>o.lignes.reduce((a,l)=>a+l.q,0);
const due=o=>o.statut==='annulee'||o.paiement==='paye'?0:Math.max(0,round2(o.montant-(o.paiement==='partiel'?o.montant_paye:0)));
const isLogi=c=>!!c&&c.type===CTYPES[0];
function defPrices(){const r=DB.parametres.find(x=>x.id==='prix');let g=null;try{g=r&&r.valeur?JSON.parse(r.valeur):null}catch(e){}return Object.assign({},DEF_PRICES,g||{})}
function prices(c){const d=defPrices(),v=k=>c&&c['prix_'+k]!==''&&c['prix_'+k]!=null?Number(c['prix_'+k]):d[k];return{prep:v('prep'),upsell:v('upsell'),retour:v('retour')}}
/* Montant d'une commande : préparation (clients logistique) + upsells + produits vendus (stock propre) */
function orderFee(c,lignes,ups){const pr=prices(c);let m=0;if(isLogi(c)){if(lignes.length||ups)m+=pr.prep;m+=(Number(ups)||0)*pr.upsell}
  lignes.forEach(l=>m+=l.q*(Number(prod(l.p)?.prix)||0));return round2(m)}
function feeDetail(c,lignes,ups){const pr=prices(c),p=[];if(isLogi(c)){if(lignes.length||ups)p.push(`préparation ${eur(pr.prep)}`);if(ups)p.push(`${ups} upsell × ${eur(pr.upsell)}`)}
  const v=lignes.reduce((s,l)=>s+l.q*(Number(prod(l.p)?.prix)||0),0);if(v)p.push(`produits ${eur(v)}`);return p.join(' + ')||'—'}
function dueItems(cid){const os=DB.commandes.filter(o=>o.statut!=='annulee'&&(!cid||o.client_id===cid)&&due(o)>0).map(o=>({k:'commandes',o,lib:o.numero,det:lignesTxt(o,2)}));
  const fs=DB.frais.filter(x=>(!cid||x.client_id===cid)&&due(x)>0).map(x=>({k:'frais',o:x,lib:x.libelle,det:x.notes||''}));return os.concat(fs)}
const dueTotal=cid=>round2(dueItems(cid).reduce((s,i)=>s+due(i.o),0));
const upsOfMonth=(cid,m)=>DB.commandes.filter(o=>o.statut!=='annulee'&&(!cid||o.client_id===cid)&&o.date.startsWith(m)).reduce((s,o)=>s+(o.ups||0),0);
const delayOf=o=>o.date_exp?Math.max(0,diffDays(o.date,o.date_exp)):null;
const fmtDelay=v=>v==null?'—':(v<0.5?'J+0':'J+'+num(v));
function delayStats(cid,days){const from=addDays(todayStr(),-((days||30)-1));const ds=DB.commandes.filter(o=>o.statut!=='annulee'&&(!cid||o.client_id===cid)&&o.date>=from&&o.date_exp).map(delayOf);
  return{n:ds.length,avg:ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:null,j1:ds.length?ds.filter(x=>x<=1).length/ds.length:null}}
const lateOrders=cid=>DB.commandes.filter(o=>['a_preparer','preparee'].includes(o.statut)&&(!cid||o.client_id===cid)&&diffDays(o.date,todayStr())>=2);
function costs(){const r=DB.parametres.find(x=>x.id==='couts');let g=null;try{g=r&&r.valeur?JSON.parse(r.valeur):null}catch(e){}return Object.assign({mo:0.5},g||{})}
const packOf=c=>c&&c.emballage?prod(c.emballage):null;
function margeClient(cid,m){const c=client(cid);const os=DB.commandes.filter(o=>o.client_id===cid&&o.statut!=='annulee'&&o.date.startsWith(m));const fr=DB.frais.filter(x=>x.client_id===cid&&x.date.startsWith(m));
  const ca=round2(os.reduce((s,o)=>s+o.montant,0)+fr.reduce((s,x)=>s+x.montant,0));const pk=packOf(c),pc=Number(pk?.cout)||0,mo=Number(costs().mo)||0;
  const cogs=os.reduce((s,o)=>s+o.lignes.reduce((a,l)=>{const p=prod(l.p);return a+(p&&p.client_id!==cid?l.q*(Number(p.cout)||0):0)},0),0);
  const pack=os.reduce((s,o)=>{const u=consoUse(c,o);let v=0;for(const k in u)v+=u[k]*(Number(prod(k)?.cout)||0);return s+v},0);

function lotsOf(pid){const p=prod(pid);if(!p||!p.fefo)return null;
  const m={};DB.mouvements.filter(x=>x.produit_id===pid&&x.qte>0&&x.dlc).forEach(x=>{const k=x.dlc+'|'+(x.lot||'');const l=m[k]||(m[k]={lot:x.lot||'',dlc:x.dlc,recu:0,date:x.date});l.recu+=x.qte;if(x.date<l.date)l.date=x.date});
  const lots=Object.values(m).sort((a,b)=>b.dlc.localeCompare(a.dlc)||b.date.localeCompare(a.date));
  let rem=Math.max(0,physStock(pid));lots.forEach(l=>{l.reste=Math.min(l.recu,rem);rem-=l.reste});

function forecast(p){
  const st=stockOf(p.id),s30=sumDays(p.id,30),s90=sumDays(p.id,90);
  const v30=s30/30,v90=s90/90;
  const rate=(v30>0&&v90>0)?0.6*v30+0.4*v90:Math.max(v30,v90);
  const delai=Number(p.delai)||14,couv=Number(p.couverture)||30,secu=Math.max(3,Math.round(delai*0.5));
  const days=rate>0?Math.max(0,st)/rate:Infinity;
  const reco=rate>0?Math.max(0,Math.ceil(rate*(delai+secu+couv)-Math.max(0,st))):0;
  const orderIn=rate>0?Math.floor(days-delai-secu):Infinity;
  let lvl;
  if(st<=0)lvl='rupture';
  else if(rate>0&&orderIn<=0)lvl='now';
  else if((rate>0&&orderIn<=14)||(p.seuil!==''&&st<=Number(p.seuil)))lvl='soon';
  else if(rate===0)lvl='idle';
  else lvl='ok';
  const trend=v90>0?(v30/v90-1):null;
  return {st,s30,s90,rate,days,reco,orderIn,lvl,trend,delai,secu,couv,orderBy:isFinite(orderIn)?addDays(todayStr(),Math.max(0,orderIn)):''};

function filteredOrders(){
  const f=F.orders;let list=DB.commandes.slice();
  if(f.client)list=list.filter(o=>o.client_id===f.client);
  if(f.statut)list=list.filter(o=>o.statut===f.statut);
  if(f.pay)list=list.filter(o=>f.pay==='du'?due(o)>0:o.paiement===f.pay);
  if(f.month)list=list.filter(o=>o.date.startsWith(f.month));
  if(f.ups)list=list.filter(o=>(o.ups>0)===(f.ups==='avec'));
  if(f.q){const q=f.q.toLowerCase();list=list.filter(o=>[o.numero,o.destinataire,o.suivi,o.notes,o.transporteur,cname(o.client_id)].join(' ').toLowerCase().includes(q)||o.lignes.some(l=>pname(l.p).toLowerCase().includes(q)))}
  return list.sort((a,b)=>b.date.localeCompare(a.date)||String(b.numero).localeCompare(String(a.numero),'fr',{numeric:true}));
}

function pickList(){const f=F.pick;return DB.commandes.filter(o=>(f.inc==='both'?['a_preparer','preparee']:['a_preparer']).includes(o.statut)&&(!f.client||o.client_id===f.client)).sort((a,b)=>a.date.localeCompare(b.date)||String(a.numero).localeCompare(String(b.numero),'fr',{numeric:true}))}
function vPicking(){
  const f=F.pick,os=pickList(),t=todayStr(),done=LS.get('cs_pickdone',{});
  const agg={};os.forEach(o=>o.lignes.forEach(l=>{const a=agg[l.p]||(agg[l.p]={p:l.p,q:0,n:0});a.q+=l.q;a.n++}));
  const rows=Object.values(agg).map(a=>({...a,pr:prod(a.p)})).sort((a,b)=>(a.pr?.emplacement||'~').localeCompare(b.pr?.emplacement||'~','fr',{numeric:true})||pname(a.p).localeCompare(pname(b.p)));
  const packs={};let noPack=0;os.forEach(o=>{const c=client(o.client_id),u=consoUse(c,o);if(!c?.emballage)noPack++;for(const k in u)packs[pname(k)]=(packs[pname(k)]||0)+u[k]});if(noPack)packs['Emballage non défini']=noPack;
  const pcl=[...new Set(os.map(o=>o.client_id))].map(client).filter(Boolean);
  const nArt=rows.reduce((s,r)=>s+r.q,0),late=os.filter(o=>diffDays(o.date,t)>=2).length,nDone=rows.filter(r=>done[r.p]).length;
  const html=`
  <div class="toolbar">
    <select data-f="pick.client">${opt('','Tous les clients',f.client)}${clientOpts().map(([v,l])=>opt(v,l,f.client)).join('')}</select>
    <select data-f="pick.inc">${opt('a_preparer','À préparer',f.inc)}${opt('both','À préparer + préparées (à expédier)',f.inc)}</select>
    <div class="sp noprint"><button class="btn ghost" data-act="printPick">Imprimer</button>${os.length?'<button class="btn primary" data-act="scanStart" style="font-size:15px">⚡ Mode scan</button>':''}${os.length?`<button class="btn" data-act="pickAll" data-v="preparee">Tout marquer préparé</button><button class="btn primary" data-act="pickAll" data-v="expediee">Tout expédié ✓</button>`:''}</div>
  </div>
  <div class="kpis">
    ${kpi('Commandes',os.length,f.inc==='both'?'à préparer ou à expédier':'à préparer')}

      <div class="sp">${need.length&&k!==OWN&&k!==EMB?`${c?.telephone?`<button class="btn sm" data-act="recoWa" data-id="${k}">Envoyer la reco sur WhatsApp</button>`:''}<button class="btn sm ghost" data-act="recoCopy" data-id="${k}">Copier la reco</button>`:''}${need.length&&(k===OWN||k===EMB)?`<button class="btn sm ghost" data-act="recoCopy" data-id="${k}">Copier la liste d’achat</button>`:''}</div></div>
      <div class="tbl"><table><thead><tr><th>Produit</th><th class="r">Stock</th><th class="r">Vendus 30 j</th><th class="r">Tendance</th><th class="r">/ jour</th><th class="r">Couverture</th><th>12 semaines</th><th>Commander avant</th><th class="r">Qté conseillée</th><th>Statut</th></tr></thead><tbody>

/* ============ Mode scan (préparation) ============ */
const SC={on:false};
function scanStart(){
  const os=pickList();if(!os.length){toast('Rien à préparer');return}
  const agg={};os.forEach(o=>o.lignes.forEach(l=>{(agg[l.p]||(agg[l.p]={p:l.p,q:0})).q+=l.q}));
  const byBin={};Object.values(agg).forEach(a=>{const pr=prod(a.p);const b=pr&&pr.emplacement?binKey(pr.emplacement):'';const k=b||('~'+a.p);(byBin[k]||(byBin[k]={bin:b,items:[]})).items.push({...a,lots:pickLots(a.p,a.q)})});
  const picks=Object.values(byBin).sort((a,b)=>(a.bin||'~').localeCompare(b.bin||'~','fr',{numeric:true}));
  Object.assign(SC,{on:true,phase:'pick',orders:os.map(o=>o.id),picks,i:0,done:new Set(),packed:new Set(),skipped:new Set(),oi:0,t0:Date.now(),last:'',lastT:0,buf:'',bufT:0,msg:'',msgT:''});
  try{const A=window.AudioContext||window.webkitAudioContext;SC.ac=SC.ac||new A();SC.ac.resume&&SC.ac.resume();const o=SC.ac.createOscillator(),g=SC.ac.createGain();g.gain.value=0;o.connect(g);g.connect(SC.ac.destination);o.start();o.stop(SC.ac.currentTime+.01)}catch(e){}
  $('#scanui').classList.add('open');document.body.style.overflow='hidden';scanDraw();camStart();
}
function scanStop(silent){
  if(!SC.on)return;camStop();SC.on=false;$('#scanui').classList.remove('open');$('#scanui').innerHTML='';document.body.style.overflow='';
  const n=SC.packed.size,min=(Date.now()-SC.t0)/60000;
  if(n){const art=SC.orders.filter(id=>SC.packed.has(id)).map(findO).filter(Boolean).reduce((a,o)=>a+qtyOf(o),0);
    const ss=sessions();ss.push({d:todayStr(),u:LS.get('cs_user',''),cmd:n,art,min:Math.max(1,Math.round(min*10)/10)});saveParam('sessions',JSON.stringify(ss.slice(-300)));
    if(!silent)toast(`${n} commande(s) en ${Math.max(1,Math.round(min))} min → ${Math.round(n/Math.max(min,1)*60)} cdes/h`)}
  render();
}
function feedback(ok){try{navigator.vibrate&&navigator.vibrate(ok?50:[180,80,180])}catch(e){}
  try{const A=window.AudioContext||window.webkitAudioContext;SC.ac=SC.ac||new A();if(SC.ac.state==='suspended')SC.ac.resume();const o=SC.ac.createOscillator(),g=SC.ac.createGain();o.frequency.value=ok?1046:196;o.type=ok?'sine':'square';g.gain.value=.12;o.connect(g);g.connect(SC.ac.destination);o.start();o.stop(SC.ac.currentTime+(ok?.09:.35))}catch(e){}
  const fl=$('#scFlash');if(fl){fl.className='sc-flash '+(ok?'ok':'bad');setTimeout(()=>fl&&(fl.className='sc-flash'),260)}}
function scanMsg(t,ok){SC.msg=t;SC.msgT=ok?'ok':'bad';const m=$('#scMsg');if(m){m.textContent=t;m.className='sc-msg '+SC.msgT}}
function onScan(raw){
  if(!SC.on)return;const code=binKey(raw);if(!code)return;const now=Date.now();if(code===SC.last&&now-SC.lastT<1500)return;SC.last=code;SC.lastT=now;
  if(SC.phase!=='pick'){scanMsg(`Bac ${code} scanné — la cueillette est terminée`,false);feedback(false);return}
  const idx=SC.picks.findIndex(x=>x.bin===code);
  if(idx<0){feedback(false);scanMsg(`✗ ${code} : aucun article à prendre dans ce bac`,false);return}
  if(SC.done.has(idx)){feedback(false);scanMsg(`Bac ${code} déjà prélevé`,false);return}
  SC.done.add(idx);feedback(true);scanMsg(idx===SC.i?`✓ ${code} prélevé`:`✓ ${code} prélevé (hors ordre)`,true);advance();
}
function advance(){const n=SC.picks.length;for(let k=0;k<n;k++){const j=(SC.i+k)%n;if(!SC.done.has(j)){SC.i=j;scanDraw();return}}SC.phase='pack';SC.oi=0;camStop();scanDraw();}
function camStop(){if(SC.raf)cancelAnimationFrame(SC.raf);SC.raf=0;if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}}
async function camStart(){
  if(SC.phase!=='pick'||SC.stream)return;const v=$('#scVideo'),off=$('#scOff');if(!v)return;
  if(!navigator.mediaDevices?.getUserMedia){off.innerHTML='Caméra indisponible ici.<br>Utilise une douchette ou tape le code ci-dessous.';return}
  try{SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=SC.stream;await v.play();off.style.display='none'}
  catch(e){off.innerHTML='Autorise la caméra pour scanner<br><small>(ou utilise une douchette / tape le code)</small>';return}
  let det=null;if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  if(!det){try{await loadLib('jsqr')}catch(e){off.style.display='grid';off.textContent=e.message;return}}

function adjustForm(pid){
  const p=prod(pid),st=stockOf(pid);
  const body=`<p>Stock théorique de <b>${h(p.nom)}</b> : <b>${num(st)}</b></p><div class="grid2">
    ${field('Type de correction',chips('type',[['ajustement','Inventaire (je compte)'],['perte','Perte / casse'],['reception','Réception']],'ajustement'),'span2')}
    ${field('<span id="adjLbl">Quantité comptée</span>',inp('qte','','type="number" inputmode="numeric" autofocus required'))}${field('Date',inp('date',todayStr(),'type="date"'))}
    ${p.fefo?`<div class="span2 grid2" id="adjLot" style="margin:0;display:none">${field('N° de lot',inp('lot','','placeholder="optionnel"'))}${field('DLC',inp('dlc','','type="date"'))}</div>`:''}
    ${field('Note',inp('note','','placeholder="optionnel"'),'span2')}</div><p class="muted small" id="adjHint"></p>`;
  modal('Corriger le stock',body,{onMount(f){
    f.addEventListener('chipchange',e=>{if(e.detail.name==='type'&&$('#adjLot'))$('#adjLot').style.display=e.detail.value==='reception'?'':'none'});
    const lbl={ajustement:'Quantité comptée',perte:'Quantité perdue / cassée',reception:'Quantité reçue'};
    const hint=()=>{const t=f.elements.type.value,q=parseInt(f.elements.qte.value);$('#adjLbl').textContent=lbl[t];$('#adjHint').textContent=isNaN(q)?'':t==='ajustement'?`Écart enregistré : ${q-st>=0?'+':''}${q-st}`:t==='perte'?`Nouveau stock : ${st-q}`:`Nouveau stock : ${st+q}`};
    f.addEventListener('input',hint);f.addEventListener('chipchange',hint);
  },onSubmit(d){
    const q=parseInt(d.qte);if(isNaN(q)){toast('Saisis une quantité');return}
    const delta=d.type==='ajustement'?q-st:d.type==='perte'?-Math.abs(q):Math.abs(q);

    if(p.fefo&&d.type==='reception'&&!d.dlc){toast('Indique la DLC du lot reçu');return}
    closeModal();save('mouvements',{id:uid('mvt'),date:d.date||todayStr(),produit_id:pid,type:d.type,qte:delta,lot:d.type==='reception'?(d.lot||'').trim():'',dlc:d.type==='reception'?(d.dlc||''):'',note:d.note.trim()});toast(`Stock corrigé (${delta>0?'+':''}${delta})`);
  }});
}

function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const d=first.split(';').length>first.split(',').length?';':(first.includes('\t')&&!first.includes(',')?'\t':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const IMP_COLS={num:['name','numero','numéro','n°','order','order number','order_number','order id','commande','n° commande'],date:['created at','created_at','date','order date','date commande'],sku:['lineitem sku','sku','item sku','reference','référence','ref'],qty:['lineitem quantity','quantite','quantité','qty','quantity','qte','qté'],pn:['lineitem name','produit','product','product name','item name','article'],ful:['fulfillment status','statut expedition','statut expédition'],fat:['fulfilled at','date expedition','date expédition'],cancel:['cancelled at'],ship:['shipping name','destinataire','nom','client'],city:['shipping city','ville'],track:['tracking number','tracking','suivi']};
function readImport(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('Le fichier est vide.');
  const hdr=rows[0].map(x=>String(x).trim().toLowerCase());const ix={};
  for(const k in IMP_COLS)ix[k]=hdr.findIndex(c=>IMP_COLS[k].includes(c));
  if(ix.num<0||ix.qty<0||(ix.sku<0&&ix.pn<0))throw new Error('Colonnes introuvables. Il faut au minimum : n° de commande, quantité, et SKU ou nom du produit (l’export Shopify standard les contient).');
  const get=(r,k)=>ix[k]>=0?String(r[ix[k]]??'').trim():'';
  const orders=new Map();
  rows.slice(1).forEach(r=>{const n=get(r,'num');if(!n)return;let o=orders.get(n);
    if(!o){o={numero:n,date:'',ful:'',fat:'',cancel:'',ship:'',city:'',track:'',items:[]};orders.set(n,o)}
    for(const k of ['date','ful','fat','cancel','ship','city','track'])if(!o[k])o[k]=get(r,k);
    const q=parseInt(get(r,'qty'));if(q>0)o.items.push({sku:get(r,'sku'),name:get(r,'pn'),q})});
  return [...orders.values()];
}
function impDate(s){let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[0];m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(m[2])+'-'+pad(m[1])}return todayStr()}
const impKey=it=>(it.sku||it.name).toLowerCase();

  const sku=it.sku.toLowerCase(),nm=it.name.toLowerCase();

  if(!p&&nm)p=ps.find(p=>p.nom.toLowerCase()===nm)||ps.find(p=>nm.startsWith(p.nom.toLowerCase()+' '));
  return p?p.id:null;

/* ============ évènements globaux ============ */
document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){const box=chip.closest('[data-chips]');const f=chip.closest('form');if(box&&f){e.preventDefault();setChip(f,box.dataset.chips,chip.dataset.v)}return}
  const t=e.target.closest('[data-act]');
  if(PORTAL)return;
  if(t&&ACT[t.dataset.act]){if(t.tagName!=='INPUT')e.preventDefault();ACT[t.dataset.act](t.dataset,t,e);return}
  if(e.target.id==='modal')closeModal();
  if(!e.target.closest('.search'))$('#qres').classList.remove('open');
});
function onFilter(e){const el=e.target;const k=el.dataset&&el.dataset.f;if(!k)return;const [a,b]=k.split('.');F[a][b]=el.value;SEL.clear();render();if(el.tagName==='INPUT'){const n=$(`[data-f="${k}"]`);if(n){n.focus();const l=n.value.length;try{n.setSelectionRange(l,l)}catch(_){}}}}
$('#view').addEventListener('input',e=>{if(e.target.tagName==='INPUT')onFilter(e)});
$('#view').addEventListener('change',e=>{if(e.target.tagName==='SELECT')onFilter(e)});
document.addEventListener('keydown',e=>{
  if(SC.on)return;
  if(e.key==='Escape'){if($('#modal').classList.contains('open'))closeModal();$('#qres').classList.remove('open');return}
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.metaKey||e.ctrlKey||e.altKey||$('#modal').classList.contains('open'))return;
  const k=e.key.toLowerCase();
  if(ROLE==='prep'&&(k==='n'||k==='i'))return;
  if(k==='n'){e.preventDefault();orderForm()}else if(k==='r'){e.preventDefault();returnNewForm()}else if(k==='e'){e.preventDefault();receptionForm()}else if(k==='i'){e.preventDefault();importForm()}else if(k==='/'){e.preventDefault();$('#q').focus()}
});
/* recherche globale */
$('#q').addEventListener('input',()=>{
  const q=$('#q').value.trim().toLowerCase(),box=$('#qres');if(q.length<2){box.classList.remove('open');return}
  const res=[];
  DB.clients.filter(c=>c.nom.toLowerCase().includes(q)).slice(0,4).forEach(c=>res.push(`<button data-act="openClient" data-id="${c.id}"><span>${h(c.nom)}</span><small>Client</small></button>`));
  DB.produits.filter(p=>(p.nom+' '+p.sku).toLowerCase().includes(q)).slice(0,5).forEach(p=>res.push(`<button data-act="prodHist" data-id="${p.id}"><span>${h(p.nom)}</span><small>${h(cname(p.client_id))} · stock ${num(stockOf(p.id))}</small></button>`));
  DB.commandes.filter(o=>[o.numero,o.destinataire,o.suivi].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).forEach(o=>res.push(`<button data-act="editOrder" data-id="${o.id}"><span>${h(o.numero)} ${o.destinataire?'· '+h(o.destinataire):''}</span><small>${h(cname(o.client_id))} · ${fd(o.date)}</small></button>`));
  box.innerHTML=res.join('')||'<div class="empty" style="padding:14px">Aucun résultat</div>';box.classList.add('open');
});

  const mk=(date,cid,lignes,ups,montant,statut,pay)=>{n++;db.commandes.push({id:'o'+n,numero:'#'+(1000+n),date,client_id:cid,destinataire:'',lignes,ups,statut,date_exp:['expediee','livree'].includes(statut)?addDays(date,n%7===0?2:n%3===0?0:1):'',transporteur:cid==='c_salon'||cid==='c_resto'?'Livraison locale':'Colissimo',suivi:'',montant,paiement:pay,montant_paye:0,date_paiement:pay==='paye'?addDays(date,3):'',notes:'',created:now,updated:now})};
  for(let d=-110;d<=0;d++){
    const date=addDays(t,d),age=-d;const st=age<=1?'a_preparer':age<=3?'expediee':'livree';
    const nu=Math.round(R()*3.6);
    for(let i=0;i<nu;i++){const l=[{p:'p_cils',q:1}];let u=0;if(R()<0.3){l.push({p:'p_masc',q:1});u++}if(R()<0.12+(110-age)/500){l.push({p:'p_serum',q:1});u++}mk(date,'c_uglam',l,u,0,st,'paye')}
    if(R()<0.55){const l=[{p:'p_brume',q:R()<0.3?2:1}];let u=0;if(R()<0.25){l.push({p:'p_coffret',q:1});u=1}mk(date,'c_pure',l,u,round2(D.prep+u*D.upsell),st,age>32?'paye':'non')}
    if(R()<0.7)mk(date,'c_miswak',[{p:'p_miswak',q:R()<0.2?2:1}],0,D.prep,st,age>32?'paye':'non');
    if(d%9===0)mk(date,'c_salon',[{p:'p_nam_n',q:10},{p:'p_nam_b',q:6}],0,round2(16*14.5),st,age>20?'paye':'non');
    if(age<=40&&R()<0.8){const l=[{p:'p_cara',q:1}];if(R()<0.2)l.push({p:'p_conf',q:1});mk(date,'c_epic',l,0,D.prep,st,age>32?'paye':'non')}
    if(d%17===0)mk(date,'c_resto',[{p:'p_nfc',q:2}],0,118,st,age>20?'paye':'non');
  }
  const ord=cid=>db.commandes.filter(o=>o.client_id===cid&&o.date<addDays(t,-8)).slice(-3)[0];
  const rets=[[null,'p_cils','c_uglam','Défaut / casse','abime','detruit',30],[ord('c_pure'),'p_brume','c_pure','Colis non réclamé','revendable','stock',5],[null,'p_cils','c_uglam',"Changement d'avis",'revendable','stock',18],[ord('c_miswak'),'p_miswak','c_miswak','Erreur de préparation','revendable','stock',12],[null,'p_masc','c_uglam','Défaut / casse','a_verifier','attente',2],[null,'p_cils','c_uglam','Défaut / casse','abime','detruit',44]];
  rets.forEach((r,i)=>{db.retours.push({id:'r'+i,dossier:'d'+i,date:addDays(t,-r[6]),client_id:r[2],commande_id:r[0]?r[0].id:'',produit_id:r[1],qte:1,motif:r[3],etat:r[4],decision:r[5],notes:'',created:now,updated:now});
    if(r[2]!=='c_uglam')db.frais.push({id:'fr_d'+i,date:addDays(t,-r[6]),client_id:r[2],libelle:'Retour'+(r[0]?' — commande '+r[0].numero:''),qte:1,pu:D.retour,montant:D.retour,paiement:'non',montant_paye:0,date_paiement:'',auto:'retour',notes:'',created:now,updated:now})});
  return db;
}

function applyTheme(t){document.documentElement.dataset.theme=t;const l=$('#themeLbl');if(l)l.textContent=t==='light'?'Thème sombre':'Thème clair'}
applyTheme(LS.get('cs_theme','dark'));
/* ============ démarrage ============ */
(function init(){
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(PORTAL){document.body.classList.add('portal');DB=emptyDB();ROUTE='portal';render();
    fetch(QS.get('api')||'',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'portal',portail:PORTAL})}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);DB=normDB(j.data);invalidate();render()})
      .catch(e=>{$('#view').innerHTML=`<div class="card">${emptyState('Lien indisponible',e.message||'Ce lien a peut-être été désactivé.')}</div>`});return}
  if(CFG.url){DB=normDB(LS.get('cs_db',null));SYNC={state:'busy'};render();pull()}
  else{const d=LS.get('cs_db',null);if(d)DB=normDB(d);else{DB=demoDB();LS.set('cs_demo',true);persist()}SYNC={state:'local'};render()}
})();
</script>
